services:
  - type: web
    name: dobu-martial-arts
    env: node
    plan: free
    buildCommand: echo "no build step needed"
    startCommand: node --experimental-sqlite server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/dobu.db